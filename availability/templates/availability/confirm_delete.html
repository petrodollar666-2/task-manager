{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="mb-4 text-2xl font-semibold text-slate-900">{{ title }}</h1>
  <form method="post" class="rounded-xl border bg-white p-5 shadow-sm">
    {% csrf_token %}
    <p class="text-sm text-slate-700">Bạn có chắc muốn xoá?</p>
    <p class="mt-2 rounded-lg bg-slate-50 px-3 py-2 text-sm font-medium text-slate-900">{{ description }}</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <button type="submit" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-red-700">Xoá</button>
      <a href="{{ cancel_url }}" class="rounded-lg border px-4 py-2 text-sm hover:bg-slate-50">Huỷ</a>
    </div>
  </form>
</div>
{% endblock %}
