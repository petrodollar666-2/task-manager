{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="mx-auto mt-16 max-w-sm rounded-xl border bg-white p-6 shadow-sm">
  <h1 class="mb-1 text-xl font-semibold">Đăng nhập</h1>
  <p class="mb-5 text-sm text-slate-500">Hệ thống quản lý công việc của Khoa</p>
  {% if form.errors %}
    <p class="mb-4 rounded bg-red-50 px-3 py-2 text-sm text-red-700">Sai tên đăng nhập hoặc mật khẩu.</p>
  {% endif %}
  <form method="post" class="space-y-4">{% csrf_token %}
    <label class="block text-sm">Tên đăng nhập
      <input name="username" autofocus required class="mt-1 w-full rounded border px-3 py-2" value="{{ form.username.value|default:'' }}">
    </label>
    <label class="block text-sm">Mật khẩu
      <input type="password" name="password" required class="mt-1 w-full rounded border px-3 py-2">
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="w-full rounded bg-indigo-600 py-2 font-medium text-white hover:bg-indigo-700">Đăng nhập</button>
  </form>
</div>
{% endblock %}
